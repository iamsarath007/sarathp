<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NewTaste - Log In</title>
  <link rel="stylesheet" href="./login-page.css" />
</head>

<body>

  <div class="login-card">

    <div class="brand-title">NewTaste</div>
    <h1 class="form-title">Welcome back</h1>

    <form action="#" method="POST" id="loginform">
      <div class="form-group">
        <input id="loginmail" type="email" class="input-field" placeholder="Email" required />
      </div>

      <div class="form-group">
        <input id="loginPassword" type="password" class="input-field" placeholder="Password" required />
      </div>

      <p id="loginError" style="color: red; margin-top: 10px; font-size: 14px;"></p>

      <button type="submit" class="btn-submit">Log in</button>
    </form>

    <p class="footer-text">
      Don't have an account? <a href="./signup-page.html">Sign up</a>
    </p>
  </div>

  <script src="./login-page.js"></script>

</body>

</html>
