<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify</title>

     <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">


    <link rel="stylesheet" href="./spotify-sign-up-page.css">
    <link rel="icon" href="./Spotify-Logo.svg">

</head>
<body>
    <div>

     <header class="header">
         <img class="Spotify-Logo" src="./spotify-logo-1.webp" alt="Spotify-Logo">
     </header>
    <div class="text-1">
         <h1 class="header-text">Sign up to <br>start listening</h1>
    </div>

    <div class="email-box">
        <label class="email-label">Email address</label>
        <input class="email-input" type="email"required placeholder="name@domain.com">
    </div>

    <div>
       <button class="button-1">Next</button>
    </div>

    <p class="or">or</p>

   </div>

   <div class="button-2">
    <img class="phone-Icon" src="./Phone-Icon.svg" alt="phone-Icon">
    <p class="button-2-text"> Sign up with phone number</p>
   </div>

   <div class="button-3">
    <img class="Google-Icon" src="./Google-Icon.svg" alt="Google-Icon">
     <p class="button-3-text"> Sign up with Google</p>
   </div>

   <div class="button-5">
    <img class="Apple-Icone" src="./apple-icon.svg" alt="Apple-Icon">
    <p class="button-5-text"> Sign up with Apple</p>
   </div>

   <p class="p-tag">Already have an account?</p>

   <a class="login" href="./spotify-sign-up-page.html">Login</a>


   <footer>
    <p class="footer">This site is protected by reCAPTCHA and the Google <u> Privacy </u><br> <u>Policy</u> and <u>Terms of Service</u> apply.</p>
   </footer>
</body>
</html>
