<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products</title>

    <link rel="stylesheet" href="./product.css">
    <script defer src="main.js"></script>
</head>

<body>
    <main>

        <section class="products-header">
            <h1>Products</h1>
            <p>Browse the latest products fetched from the API.</p>
        </section>

        <section class="products-container">
            <div class="product-card">
                <img src="https://via.placeholder.com/300x200" alt="Product Image">

                <h3>Wireless Headphones</h3>

                <p><strong>Category:</strong> Electronics</p>

                <p><strong>Price:</strong> $99.99</p>

                <p>
                    High-quality wireless headphones with noise cancellation and
                    long battery life.
                </p>

                <button class="buy-btn">Buy Now</button>
            </div>
        </section>

    </main>

</body>

</html>
